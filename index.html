<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcane Scroll Repository</title>
    
    <!-- iOS Home Screen App Configurations -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Scroll Ledger">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root { --bg: #121212; --panel: #1e1e1e; --accent: #8a2be2; --text: #e0e0e0; --work: #d2691e; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .auth-panel, .dm-panel, .player-panel, .workbench-panel { background: var(--panel); padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .hidden { display: none !important; }
        input, select, button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 10px; margin: 5px 0; border-radius: 4px; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--accent); outline: none; }
        button { background: var(--accent); font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        button:hover { background: #a043ff; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
        
        .player-card { background: #1a1a1a; margin: 10px 0; border-radius: 6px; overflow: hidden; border-left: 4px solid var(--accent); }
        .player-header { background: #252525; padding: 15px; cursor: pointer; font-weight: bold; display: flex; justify-content: space-between; align-items: center; user-select: none; }
        .player-content { padding: 15px; background: #161616; }
        
        /* Mobile Touch-Friendly Sliding Layout Rules */
        .table-wrapper { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 10px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.95em; min-width: 650px; }
        th, td { padding: 12px; border-bottom: 1px solid #333; text-align: left; }
        th { background: #222; color: var(--accent); }
        .badge { background: #333; padding: 3px 8px; border-radius: 12px; font-size: 0.85em; }
        .lvl-badge { background: #4b0082; padding: 2px 6px; border-radius: 4px; font-size: 0.8em; margin-left: 5px; }
        .btn-consume { background: #b22222; font-size: 0.85em; padding: 5px 10px; color: #fff; border: none; border-radius: 4px; cursor: pointer;}
        .btn-consume:hover { background: #ff4500; }
        
        /* Workbench adjustments */
        .workbench-panel { border-left: 4px solid var(--work); }
        .workbench-panel h3 { color: var(--work); margin-top: 0; }
        .inline-action { display: flex; gap: 5px; align-items: center; }
        .inline-action input { width: 70px; padding: 5px; margin: 0; }
        .inline-action button { padding: 6px 10px; font-size: 0.85em; }
    </style>
</head>
<body>
<div class="container">
    <h2>📜 Arcane Scroll Ledger</h2>

    <!-- Password Gateway -->
    <div id="authPanel" class="auth-panel">
        <h3>Enter Access Cipher</h3>
        <input type="password" id="passphrase" placeholder="Enter password...">
        <button onclick="authenticate()">Unlock Vault</button>
        <p id="authError" style="color: #ff6b6b; font-size: 0.9em;"></p>
    </div>

    <!-- DM Scribing & Manifestation Module -->
    <div id="dmPanel" class="dm-panel hidden">
        <h3>✨ Scribe New Scroll (DM Vault Access)</h3>
        <form id="scribeForm" class="form-grid">
            <input type="text" id="spell" placeholder="Spell Name" required>
            <input type="text" id="spellLevel" placeholder="Spell Level (e.g. 3rd)" required>
            <input type="text" id="saveDC" placeholder="Save DC (e.g. 15)" required>
            <input type="text" id="attackBonus" placeholder="Attack Bonus (e.g. +7)" required>
            <input type="text" id="castingModifier" placeholder="Casting Modifier (e.g. Int)" required>
            <input type="text" id="holder" placeholder="Assigned To (Player)" required>
            <input type="text" id="scribedBy" placeholder="Scribed By (Creator)" required>
            
            <select id="initialStatus" style="background:#2a2a2a; color:#fff;">
                <option value="Ready">Status: Ready (Completed)</option>
                <option value="In Progress">Status: Scribing In Progress</option>
            </select>
            
            <input type="number" id="initialHours" placeholder="Initial Hours Done" value="0" min="0">
            
            <button type="submit" style="grid-column: 1 / -1; margin-top: 10px;">Log Manifestation</button>
        </form>
    </div>

    <!-- DM-Only Downtime Workbench Tool -->
    <div id="workbenchPanel" class="workbench-panel hidden">
        <h3>🛠️ Scribing Workbench (In-Progress Logs)</h3>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Spell Details</th>
                        <th>Assigned To</th>
                        <th>Scribed By</th>
                        <th>Logged Hours</th>
                        <th>Manage Progress</th>
                    </tr>
                </thead>
                <tbody id="workbenchTableBody">
                    <tr><td colspan="5">No unfinished projects currently queued.</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Main Output / Filter Views -->
    <div id="inventoryPanel" class="player-panel hidden">
        <div style="display:flex; justify-content: space-between; align-items: center;">
            <h3>Current Party Inventory</h3>
            <button onclick="fetchData()" style="font-size:0.8em; background:#333;">🔄 Refresh Data</button>
        </div>
        <div id="playerRoster">Loading ledger records...</div>
    </div>
</div>

<script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzz0O1T3kaLv62mY8lSKO2iH1FQsNekeQ3LRkZTEj53QWYCRt1DEC0sFiU3lZchLIbnYA/exec"; 
    let globalScrollsCache = [];
    let currentRole = "guest";

    function authenticate() {
        const pass = document.getElementById('passphrase').value;
        const err = document.getElementById('authError');
        
        if (pass === "player123") {
            currentRole = "player";
            initializeView();
        } else if (pass === "dm456") {
            currentRole = "dm";
            initializeView();
        } else {
            err.textContent = "Invalid cipher string. Try again.";
        }
    }

    function initializeView() {
        document.getElementById('authPanel').classList.add('hidden');
        document.getElementById('inventoryPanel').classList.remove('hidden');
        if (currentRole === 'dm') {
            document.getElementById('dmPanel').classList.remove('hidden');
            document.getElementById('workbenchPanel').classList.remove('hidden');
        }
        fetchData();
    }

    async function fetchData() {
        try {
            if(currentRole === 'dm') {
                document.getElementById('workbenchTableBody').innerHTML = "<tr><td colspan='5'>Syncing workbench...</td></tr>";
            }
            document.getElementById('playerRoster').innerHTML = "Reading master ledger files...";
            
            const response = await fetch(API_URL);
            globalScrollsCache = await response.json();
            
            renderInventory();
            if (currentRole === 'dm') {
                renderWorkbench();
            }
        } catch (e) {
            document.getElementById('playerRoster').innerHTML = "Error accessing ledger data storage.";
        }
    }

    function renderInventory() {
        const roster = document.getElementById('playerRoster');
        roster.innerHTML = "";

        // Only present "Ready" status scrolls to the players view
        const filtered = globalScrollsCache.filter(s => s.Status === "Ready");
        const playerMap = {};

        filtered.forEach(s => {
            if (!playerMap[s.Holder]) playerMap[s.Holder] = {};
            if (!playerMap[s.Holder][s.Spell]) playerMap[s.Holder][s.Spell] = [];
            playerMap[s.Holder][s.Spell].push(s);
        });

        if (Object.keys(playerMap).length === 0) {
            roster.innerHTML = "<p>No active magical scrolls found across party configurations.</p>";
            return;
        }

        for (let player in playerMap) {
            const playerCard = document.createElement('div');
            playerCard.className = 'player-card';

            let totalScrolls = 0;
            let summaryHTML = "";

            for (let spell in playerMap[player]) {
                const count = playerMap[player][spell].length;
                totalScrolls += count;
                const displayLevel = playerMap[player][spell][0]?.SpellLevel || '—';
                
                summaryHTML += `
                    <div style="margin: 15px 0; border-top: 1px solid #333; padding-top:10px;">
                        <strong style="color:#ba7fff; font-size:1.1em;">${spell}</strong> 
                        <span class="lvl-badge">Lvl ${displayLevel}</span>
                        <span class="badge" style="margin-left:5px;">${count} available</span>
                        <div class="table-wrapper">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Save DC</th>
                                        <th>Attack Bonus</th>
                                        <th>Casting Mod</th>
                                        <th>Scribed By</th>
                                        <th>Scribed Date</th>
                                        ${currentRole === 'dm' ? '<th>Action</th>' : ''}
                                    </tr>
                                </thead>
                                <tbody>
                `;

                playerMap[player][spell].forEach(instance => {
                    summaryHTML += `
                        <tr>
                            <td>${instance.SaveDC || '—'}</td>
                            <td>${instance.AttackBonus || '—'}</td>
                            <td>${instance.CastingModifier || '—'}</td>
                            <td><span style="color:#aaa;">${instance.ScribedBy || 'Unknown'}</span></td>
                            <td>${instance.CreatedDate || '—'}</td>
                            ${currentRole === 'dm' ? `<td><button class="btn-consume" onclick="consumeScroll('${instance.ID}')">Mark Used</button></td>` : ''}
                        </tr>
                    `;
                });

                summaryHTML += `</tbody></table></div></div>`;
            }

            playerCard.innerHTML = `
                <div class="player-header" onclick="this.nextElementSibling.classList.toggle('hidden')">
                    <span>👤 ${player}</span>
                    <span><span class="badge" style="background:var(--accent);">${totalScrolls} Total Scrolls</span> ▾</span>
                </div>
                <div class="player-content hidden">
                    ${summaryHTML}
                </div>
            `;
            roster.appendChild(playerCard);
        }
    }

    function renderWorkbench() {
        const tbody = document.getElementById('workbenchTableBody');
        tbody.innerHTML = "";
        
        const inProgress = globalScrollsCache.filter(s => s.Status === "In Progress");
        
        if(inProgress.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='color:#888; text-align:center; padding:20px;'>No active downtime scribing operations found.</td></tr>";
            return;
        }
        
        inProgress.forEach(s => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${s.Spell}</strong> <span class="lvl-badge">Lvl ${s.SpellLevel}</span><br>
                    <small style="color:#888;">DC ${s.SaveDC} | Atk ${s.AttackBonus} | Mod ${s.CastingModifier}</small>
                </td>
                <td>${s.Holder}</td>
                <td>${s.ScribedBy}</td>
                <td><span style="font-weight:bold; color:var(--work);">${s.HoursCompleted} hrs</span></td>
                <td>
                    <div class="inline-action">
                        <input type="number" id="hours-${s.ID}" value="${s.HoursCompleted}" min="0">
                        <button style="background:#444;" onclick="updateHours('${s.ID}')">Update</button>
                        <button style="background:green;" onclick="completeScroll('${s.ID}')">Finish 📜</button>
                    </div>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    document.getElementById('scribeForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const payload = {
            action: "create",
            id: Date.now().toString(),
            spell: document.getElementById('spell').value,
            spellLevel: document.getElementById('spellLevel').value,
            saveDC: document.getElementById('saveDC').value,
            attackBonus: document.getElementById('attackBonus').value,
            castingModifier: document.getElementById('castingModifier').value,
            holder: document.getElementById('holder').value,
            scribedBy: document.getElementById('scribedBy').value,
            status: document.getElementById('initialStatus').value,
            hoursCompleted: parseInt(document.getElementById('initialHours').value) || 0
        };

        this.reset();
        document.getElementById('initialHours').value = "0";
        await sendPayload(payload);
    });

    async function updateHours(id) {
        const val = parseInt(document.getElementById(`hours-${id}`).value) || 0;
        await sendPayload({ action: "updateHours", id: id, hours: val });
    }

    async function completeScroll(id) {
        if(confirm("Mark scroll scribing project complete? This releases it to the player inventory view.")) {
            await sendPayload({ action: "completeScribing", id: id });
        }
    }

    async function consumeScroll(id) {
        if(confirm("Confirm scroll resource consumption?")) {
            await sendPayload({ action: "consume", id: id });
        }
    }

    async function sendPayload(payload) {
        try {
            await fetch(API_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            fetchData();
        } catch (e) {
            alert("Network submission timeout. Verify active Web Deployment rules.");
            fetchData();
        }
    }
</script>
</body>
</html>
